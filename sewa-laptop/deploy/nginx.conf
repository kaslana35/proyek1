# Nginx Configuration for Sewa Laptop (Cache Poisoning Prevention)
# Place in /etc/nginx/sites-available/sewa-laptop

server {
    listen 443 ssl http2;
    server_name your-domain.com;
    root /var/www/sewa-laptop/public;
    index index.php;

    # Prevent execution of scripts in storage
    location ~* ^/storage/.*\.(php|php3|php4|php5|phtml|pl|py|jsp|asp|sh|cgi)$ {
        deny all;
        return 403;
    }

    # Cache poisoning prevention: only cache based on safe headers
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # Ignore untrusted headers in cache
    proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate;
    proxy_hide_header X-Powered-By;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # No cache for auth/admin/dynamic pages
    location ~* ^/(login|register|forgot-password|admin|profile|riwayat-sewa) {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Force HTTPS
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
