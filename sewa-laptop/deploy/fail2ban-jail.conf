# Fail2Ban Jail Configuration for Sewa Laptop
# Place in /etc/fail2ban/jail.d/sewa-laptop.conf

[sewa-laptop-auth]
enabled = true
port = http,https
filter = sewa-laptop-auth
logpath = /var/www/sewa-laptop/storage/logs/laravel.log
maxretry = 5
bantime = 3600
findtime = 600
backend = auto

[sewa-laptop-api]
enabled = true
port = http,https
filter = sewa-laptop-api
logpath = /var/www/sewa-laptop/storage/logs/laravel.log
maxretry = 60
bantime = 600
findtime = 60